<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="card-analytics-endpoint" content="" />
  <title>Карты за границей — каталог для граждан РФ</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f4f4f4;
      --surface-warm: #eef4ff;
      --fg: #191c1f;
      --fg-2: #334155;
      --muted: #505a63;
      --meta: #494fdf;
      --border: #c9c9cd;
      --border-soft: #e7e7ea;
      --accent: #494fdf;
      --accent-on: #ffffff;
      --accent-hover: color-mix(in oklab, var(--accent), black 8%);
      --accent-active: color-mix(in oklab, var(--accent), black 14%);
      --success: #007e62;
      --warn: #a85a00;
      --danger: #c72f3d;
      --font-display: "Aeonik Pro", "Inter", system-ui, sans-serif;
      --font-body: "Inter", system-ui, sans-serif;
      --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
      --text-xs: 12px;
      --text-sm: 14px;
      --text-base: 16px;
      --text-lg: 18px;
      --text-xl: 24px;
      --text-2xl: 36px;
      --text-3xl: 54px;
      --text-4xl: 76px;
      --leading-body: 1.5;
      --leading-tight: 1.02;
      --tracking-display: -0.03em;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;
      --section-y-desktop: 104px;
      --section-y-tablet: 72px;
      --section-y-phone: 52px;
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 30px;
      --radius-pill: 9999px;
      --elev-flat: none;
      --elev-ring: 0 0 0 1px var(--border);
      --elev-raised: none;
      --focus-ring: 0 0 0 4px color-mix(in oklab, var(--accent) 22%, transparent);
      --motion-fast: 150ms;
      --motion-base: 240ms;
      --ease-standard: cubic-bezier(0.22, 1, 0.36, 1);
      --container-max: 1080px;
      --container-gutter-desktop: 36px;
      --container-gutter-tablet: 28px;
      --container-gutter-phone: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-width: 0;
      overflow-x: clip;
      overflow-y: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      line-height: var(--leading-body);
      letter-spacing: .16px;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button, select, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { font-family: var(--font-display); font-weight: 500; text-wrap: balance; }
    p { text-wrap: pretty; }
    svg { display: block; flex: 0 0 auto; }
    [hidden] { display: none !important; }
    .container { width: min(100%, var(--container-max)); margin-inline: auto; padding-inline: var(--container-gutter-desktop); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    :focus-visible { outline: 0; box-shadow: var(--focus-ring); }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: color-mix(in oklab, var(--bg) 94%, transparent);
      border-bottom: 1px solid var(--border-soft);
      backdrop-filter: blur(16px);
    }
    .topbar-inner { min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
    .brand { min-height: 44px; display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 18px; font-weight: 500; letter-spacing: -.3px; }
    .brand:hover .brand-name { text-decoration: underline; text-underline-offset: 4px; }
    .brand-short { display: none; }
    .brand-mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; background: var(--fg); color: var(--bg); font-family: var(--font-mono); font-size: 11px; }
    .compare-open {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-pill);
      background: var(--surface);
      cursor: pointer;
      font-weight: 600;
    }
    .compare-open:disabled { cursor: default; opacity: .55; }
    .compare-open:not(:disabled):hover { border-color: var(--fg); }
    .count-badge { min-width: 22px; min-height: 22px; display: grid; place-items: center; padding-inline: 6px; border-radius: var(--radius-pill); background: var(--fg); color: var(--bg); font-family: var(--font-mono); font-size: 11px; }

    .intro { padding-block: 0; }
    .intro-row { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-8); }
    .eyebrow { margin-bottom: 8px; color: var(--muted); font-family: var(--font-mono); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
    h1 { max-width: 720px; font-size: clamp(34px, 5vw, 54px); line-height: 1; letter-spacing: var(--tracking-display); }
    .intro-copy { max-width: 650px; margin-top: 12px; color: var(--muted); font-size: 16px; }
    .offer-total { flex: 0 0 auto; padding: 12px 16px; border-radius: var(--radius-sm); background: var(--fg); color: var(--bg); }
    .offer-total strong { display: block; font-family: var(--font-display); font-size: 28px; font-weight: 500; line-height: 1; }
    .offer-total span { display: block; margin-top: 5px; color: color-mix(in oklab, var(--bg) 72%, var(--fg)); font-size: 11px; }

    .controls { margin-top: auto; padding-top: 22px; }
    .toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto 210px; gap: 8px; align-items: center; }
    .search { position: relative; min-width: 0; }
    .search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .search input, .sort-select {
      width: 100%;
      min-height: 46px;
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--fg);
    }
    .search input { padding: 10px 14px 10px 43px; }
    .search input::placeholder { color: var(--muted); opacity: 1; }
    .search input:focus, .sort-select:focus { border-color: var(--accent); }
    .filter-button {
      position: relative;
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--bg);
      cursor: pointer;
      font-weight: 600;
    }
    .filter-count { min-width: 20px; height: 20px; display: none; place-items: center; border-radius: var(--radius-pill); background: var(--fg); color: var(--bg); font-size: 10px; }
    .filter-button:hover { border-color: var(--fg); background: var(--surface); }
    .filter-count.is-visible { display: grid; }
    .sort-wrap { position: relative; }
    .sort-wrap svg { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; }
    .sort-select { appearance: none; padding: 10px 38px 10px 15px; cursor: pointer; font-weight: 600; }
    .chips { display: flex; gap: 8px; margin-top: 9px; overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .quick-filter { min-height: 40px; flex: 0 0 auto; padding: 8px 14px; border: 1px solid transparent; border-radius: var(--radius-pill); background: var(--surface); color: var(--muted); cursor: pointer; white-space: nowrap; }
    .quick-filter:hover { color: var(--fg); border-color: var(--border); }
    .quick-filter.is-active { background: var(--fg); color: var(--bg); }

    .catalog { height: 100dvh; padding-block: 0; background: var(--surface); overflow: hidden; }
    .deck-shell { position: relative; width: min(100%, 520px); height: 100dvh; margin-inline: auto; padding-inline: 12px; overflow: hidden; }
    .catalog-head { min-height: 32px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .result-label { color: var(--muted); }
    .result-label strong { color: var(--fg); font-family: var(--font-mono); }
    .catalog-note { color: var(--muted); font-size: 11px; text-align: right; }
    .offer-list {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .offer {
      position: absolute;
      inset: 8px 0 12px;
      display: none;
      min-width: 0;
      padding: 22px;
      overflow: hidden;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      background: var(--bg);
      transform: translate3d(0, 0, 0) rotate(0deg);
      transform-origin: 50% 105%;
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .offer.is-active { display: block; z-index: 2; }
    .offer.is-under {
      display: block;
      z-index: 1;
      pointer-events: none;
      opacity: .78;
      transform: translate3d(0, 12px, 0) scale(.965);
      transition: transform 260ms cubic-bezier(.22, .61, .36, 1), opacity 220ms linear;
      box-shadow: 0 12px 34px color-mix(in oklab, var(--fg) 12%, transparent);
    }
    .offer-list.is-swiping .offer.is-active { transition: none; }
    .offer-list.is-swiping .offer.is-under { transition: none; }
    .offer.is-leaving { pointer-events: none; }
    .offer-product { cursor: pointer; }
    .welcome-card.is-active { display: flex; flex-direction: column; background: var(--bg); }
    .welcome-mark { width: 46px; height: 46px; display: grid; place-items: center; margin-bottom: auto; border-radius: 15px; background: var(--fg); color: var(--bg); font-family: var(--font-mono); font-size: 14px; }
    .welcome-card h1 { margin-top: 28px; font-size: clamp(42px, 12vw, 68px); }
    .welcome-card .intro-copy { max-width: 34ch; }
    .welcome-card .offer-total { align-self: flex-start; margin-top: 18px; }
    .welcome-action { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-soft); color: var(--muted); }
    .welcome-action strong { color: var(--fg); }
    .offer.is-pending { display: none; }
    .offer-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; }
    .status-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 7px; }
    .status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: var(--radius-pill); font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status-review { color: var(--warn); background: color-mix(in oklab, var(--warn) 12%, var(--bg)); }
    .status-candidate { color: var(--muted); background: var(--surface); }
    .status-stale { color: var(--warn); background: color-mix(in oklab, var(--warn) 12%, var(--bg)); }
    .status-rejected { color: var(--danger); background: color-mix(in oklab, var(--danger) 10%, var(--bg)); }
    .status-conflict { color: var(--danger); background: color-mix(in oklab, var(--danger) 10%, var(--bg)); }
    .updated { color: var(--muted); font-size: 11px; }
    .offer h2 { font-size: 24px; line-height: 1.1; letter-spacing: -.35px; }
    .provider { margin-top: 5px; color: var(--muted); font-size: 13px; }
    .issuer { margin-top: 2px; font-size: 12px; }
    .issuer strong { font-weight: 650; }
    .offer-actions { display: flex; gap: 8px; align-items: center; }
    .button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 17px;
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      background: transparent;
      cursor: pointer;
      font-weight: 650;
      transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard);
    }
    .button:active { transform: translateY(1px); }
    .button-primary { background: var(--fg); color: var(--bg); }
    .button-primary:hover { background: color-mix(in oklab, var(--fg) 88%, var(--bg)); }
    .button-secondary { border-color: var(--border); background: var(--bg); color: var(--fg); }
    .button-secondary:hover { border-color: var(--fg); background: var(--surface); }
    .button[aria-disabled="true"], .button:disabled { cursor: not-allowed; color: var(--muted); background: var(--surface); border-color: transparent; }
    .compare-toggle.is-selected { border-color: var(--accent); color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, var(--bg)); }
    .key-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 16px; border-block: 1px solid var(--border-soft); }
    .key-metric { min-width: 0; padding: 13px 14px; }
    .key-metric:first-child { padding-left: 0; }
    .key-metric + .key-metric { border-left: 1px solid var(--border-soft); }
    .metric-label { display: block; color: var(--muted); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }
    .metric-value { display: block; margin-top: 4px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
    .metric-value.is-conflict { color: var(--danger); }
    .facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 18px; margin-top: 14px; }
    .fact { min-width: 0; }
    .fact-capabilities { grid-column: span 2; }
    .fact-label { display: block; color: var(--muted); font-size: 10px; letter-spacing: .03em; text-transform: uppercase; }
    .fact-value { display: block; margin-top: 3px; font-size: 12px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
    .offer-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 15px; padding-top: 13px; border-top: 1px solid var(--border-soft); }
    .evidence-note { max-width: 52ch; color: var(--muted); font-size: 11px; }

    .swipe-nav { width: min(100%, 260px); min-height: 54px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 12px; margin: -74px auto 12px; padding: 5px; position: relative; z-index: 10; border: 1px solid var(--border-soft); border-radius: var(--radius-pill); background: var(--bg); }
    .swipe-button { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 50%; background: var(--bg); cursor: pointer; }
    .swipe-button:disabled { opacity: .3; cursor: default; }
    .swipe-state { color: var(--muted); text-align: center; }
    .swipe-state strong { color: var(--fg); font-family: var(--font-mono); }
    .swipe-hint { display: block; margin-top: 2px; font-size: 11px; }

    dialog { width: min(calc(100% - 24px), 760px); max-height: calc(100dvh - 24px); margin: auto; padding: 0; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg); color: var(--fg); }
    dialog::backdrop { background: color-mix(in oklab, var(--fg) 58%, transparent); }
    .dialog-shell { max-height: calc(100dvh - 26px); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
    .dialog-head { min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 18px; border-bottom: 1px solid var(--border-soft); }
    .dialog-head h2 { font-size: 24px; }
    .icon-button { width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: var(--radius-pill); background: var(--surface); cursor: pointer; }
    .dialog-body { min-width: 0; overflow-y: auto; padding: 18px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border-soft); }
    .filter-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
    legend { margin-bottom: 7px; font-family: var(--font-display); font-size: 17px; font-weight: 500; }
    .check-row { min-height: 44px; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--border-soft); cursor: pointer; }
    .check-row input { width: 18px; height: 18px; accent-color: var(--accent); }
    .compare-empty { padding: 28px 0; color: var(--muted); text-align: center; }
    .compare-columns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .compare-card { min-width: 0; padding: 16px; border-radius: var(--radius-sm); background: var(--surface); }
    .compare-card h3 { font-size: 18px; line-height: 1.15; }
    .compare-card .status { margin-top: 8px; }
    .compare-list { margin: 14px 0 0; padding: 0; list-style: none; }
    .compare-list li { padding-block: 9px; border-top: 1px solid var(--border); }
    .compare-list span { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; }
    .compare-list strong { display: block; margin-top: 2px; font-size: 12px; overflow-wrap: anywhere; }

    .pagefoot { display: none; }
    .pagefoot-row { display: flex; justify-content: space-between; gap: 18px; }

    @media (max-width: 820px) {
      .container { padding-inline: var(--container-gutter-tablet); }
      .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .fact-capabilities { grid-column: 1 / -1; }
      .offer-head { grid-template-columns: 1fr; }
      .offer-actions { justify-content: flex-start; }
      .compare-columns { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      .container { padding-inline: var(--container-gutter-phone); }
      .topbar-inner { min-height: 56px; }
      .brand { font-size: 16px; }
      .compare-label { display: none; }
      .compare-open { padding-inline: 11px; }
      .intro { padding-block: 0; }
      .intro-row { align-items: flex-start; flex-direction: column; gap: 12px; }
      .eyebrow { margin-bottom: 6px; font-size: 10px; }
      h1 { font-size: clamp(31px, 9.8vw, 40px); line-height: 1.03; }
      .intro-copy { margin-top: 9px; font-size: 13px; line-height: 1.45; }
      .offer-total { display: inline-flex; align-items: baseline; gap: 7px; padding: 8px 11px; border-radius: 11px; }
      .offer-total strong { font-size: 22px; }
      .offer-total span { margin-top: 0; font-size: 10px; line-height: 1.2; }
      .controls { padding-top: 20px; }
      .toolbar { grid-template-columns: minmax(0, 1fr) 44px 112px; gap: 6px; }
      .search input, .sort-select, .filter-button { min-height: 44px; }
      .search input { padding-left: 40px; font-size: 13px; }
      .search svg { left: 14px; }
      .filter-button { width: 44px; padding: 0; }
      .filter-button-label { display: none; }
      .filter-count { position: absolute; margin: -28px 0 0 26px; }
      .sort-select { padding-inline: 11px 30px; font-size: 12px; }
      .sort-wrap svg { right: 10px; }
      .chips { margin-top: 7px; }
      .quick-filter { min-height: 44px; padding-inline: 13px; font-size: 12px; }
      .catalog { padding-block: 0; }
      .catalog-head { align-items: flex-start; }
      .catalog-note { max-width: 160px; }
      .deck-shell { padding-inline: 10px; }
      .offer-list { height: 100dvh; }
      .offer { inset: 8px 0 10px; padding: 18px; padding-bottom: 78px; border-radius: 26px; }
      .welcome-card h1 { font-size: clamp(39px, 11.8vw, 54px); }
      .offer h2 { font-size: 21px; }
      .provider { font-size: 12px; }
      .offer-actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); width: 100%; }
      .button { min-width: 0; padding-inline: 10px; font-size: 12px; text-align: center; }
      .key-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .key-metric { padding: 11px 10px; }
      .key-metric:first-child { padding-left: 0; }
      .key-metric:nth-child(3) { grid-column: 1 / -1; padding-left: 0; border-top: 1px solid var(--border-soft); border-left: 0; }
      .facts { gap: 9px 12px; }
      .offer-foot { align-items: flex-start; flex-direction: column; }
      .swipe-nav { margin-top: -78px; }
      .swipe-button { border: 0; background: var(--surface); }
      .filter-grid, .compare-columns { grid-template-columns: 1fr; }
      .dialog-head { padding-inline: 14px; }
      .dialog-body { padding: 14px; }
      .dialog-actions { padding-inline: 14px; }
      .pagefoot-row { flex-direction: column; gap: 6px; }
    }
    @media (max-width: 350px) {
      .brand-full { display: none; }
      .brand-short { display: inline; }
      .toolbar { grid-template-columns: minmax(0, 1fr) 44px; }
      .sort-wrap { grid-column: 1 / -1; }
      .offer-actions { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main id="catalog-start">
    <section class="catalog" data-od-id="offer-catalog" aria-label="Карточки зарубежных карт">
      <div class="deck-shell">
        <div class="offer-list" id="offer-list">
          <article class="offer welcome-card is-active" id="welcome-card" data-od-id="welcome-card">
            <div class="welcome-mark" aria-hidden="true">КЗ</div>
            <div>
              <p class="eyebrow">Независимый каталог · гражданам РФ</p>

      const list = document.querySelector('#offer-list');
      list.insertAdjacentHTML('beforeend', products.map((product) => {
        const slug = product.id.toLowerCase();
        const statusLabel = ({ candidate: 'CANDIDATE', review: 'REVIEW', stale: 'STALE', rejected: 'REJECTED' })[product.status] || 'REVIEW';
        const statusBadges = `<span class="status status-${product.status}">${statusLabel}</span>${product.conflict ? '<span class="status status-conflict">CONFLICT</span>' : ''}`;
        const searchable = [product.name, product.provider, product.issuer, product.type, product.network, product.capabilities].join(' ');
        return `
          <article class="offer offer-product" id="${slug}" tabindex="0" role="link" aria-label="Открыть ${escapeHtml(product.name)}" data-offer-id="${product.id}" data-details="${product.details}" data-od-id="offer-card-${slug}" data-name="${escapeHtml(searchable)}" data-status="${product.status}" data-tags="${product.tags.join(' ')}" data-price="${product.price}" data-updated="2026-08-12" data-rank="${product.rank}" data-page="${product.page}" data-compare-name="${escapeHtml(product.name)}" data-conflict="${product.conflict}">
            <div class="offer-head">
              <div>
                <div class="status-line">${statusBadges}<span class="updated">Проверено 12.08.2026</span></div>
                <h2 data-od-id="offer-title-${slug}">${escapeHtml(product.name)}</h2>
                <p class="provider">${escapeHtml(product.provider)}</p>
                <p class="issuer"><strong>Банк-эмитент:</strong> ${escapeHtml(product.issuer)}</p>
              </div>
              <div class="offer-actions">
                <a class="button button-primary" href="${product.details}" data-od-id="details-${slug}">Подробнее
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
                </a>
                <button class="button button-secondary compare-toggle" type="button" data-card-id="${slug}" data-od-id="compare-${slug}" aria-pressed="false">Сравнить</button>
              </div>
            </div>
            <div class="key-metrics">
              <div class="key-metric"><span class="metric-label">Паспорт РФ</span><span class="metric-value">${escapeHtml(product.passport)}</span></div>
              <div class="key-metric"><span class="metric-label">Выпуск</span><span class="metric-value${product.conflict ? ' is-conflict' : ''}">${escapeHtml(product.issue)}</span></div>
              <div class="key-metric"><span class="metric-label">Обслуживание</span><span class="metric-value">${escapeHtml(product.service)}</span></div>
            </div>
            <div class="facts">
              <div class="fact"><span class="fact-label">Тип карты</span><span class="fact-value">${escapeHtml(product.type)}</span></div>
              <div class="fact"><span class="fact-label">Платёжная система</span><span class="fact-value">${escapeHtml(product.network)}</span></div>
              <div class="fact"><span class="fact-label">Главные возможности</span><span class="fact-value">${escapeHtml(product.capabilities)}</span></div>
              <div class="fact"><span class="fact-label">Партнёрская программа</span><span class="fact-value">${escapeHtml(product.affiliate)}</span></div>
            </div>
            <div class="offer-foot"><p class="evidence-note">Внешнее оформление заблокировано до проверки.</p><span class="updated">12.08.2026 · ${statusLabel}${product.conflict ? ' + CONFLICT' : ''}</span></div>
          </article>
        `;
      }).join(''));

      const welcomeCard = document.querySelector('#welcome-card');
      const offers = [...document.querySelectorAll('.offer-product')];
      const swipeCurrent = document.querySelector('#swipe-current');
      const swipeTotal = document.querySelector('#swipe-total');
      const swipePrev = document.querySelector('#swipe-prev');
      const swipeNext = document.querySelector('#swipe-next');
      const compareDialog = document.querySelector('#compare-dialog');
      const compareContent = document.querySelector('#compare-content');
      let storedIds = [];
      try {
        const parsed = JSON.parse(localStorage.getItem('card-comparison') || '[]');
        storedIds = Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        storedIds = [];
      }
      const selected = new Set(storedIds.filter((id) => document.getElementById(id)).slice(0, 3));
      let activeCardIndex = 0;
      let pointerStartX = 0;
      let pointerDeltaX = 0;
      let activePointerId = null;
      let didDrag = false;
      let swipeFrame = 0;
      let deckWidth = list.clientWidth;
      let underCard = null;
      let isAnimating = false;
      let cardAnimation = null;
      const cardDeck = [welcomeCard, ...offers];

      function wordForCount(count) {
        if (count % 10 === 1 && count % 100 !== 11) return 'предложение';
        if ([2, 3, 4].includes(count % 10) && ![12, 13, 14].includes(count % 100)) return 'предложения';
        return 'предложений';
      }

      function visibleOffers() {
        return offers;
      }

      function visibleCards() {
        return cardDeck;
      }

      function updateSwipeState() {
        const visible = visibleCards();
        swipeCurrent.textContent = activeCardIndex + 1;
        swipeTotal.textContent = visible.length;
        swipePrev.disabled = visible.length < 2;
        swipeNext.disabled = visible.length < 2;
      }

      function activeCard() { return visibleCards()[activeCardIndex]; }

      function resetTransform(card) {
        card.style.transform = '';
        card.style.opacity = '';
      }

      function underIndexFor(direction = 1) {
        const cards = visibleCards();
        if (cards.length < 2) return -1;
        return (activeCardIndex + direction + cards.length) % cards.length;
      }

      function showUnderCard(direction = 1, progress = 0) {
        const cards = visibleCards();
        const underIndex = underIndexFor(direction);
        const nextUnder = underIndex === activeCardIndex ? null : cards[underIndex];
        if (underCard !== nextUnder) {
          if (underCard) {
            underCard.classList.remove('is-under');
            resetTransform(underCard);
          }
          underCard = nextUnder;
          if (underCard) underCard.classList.add('is-under');
        }
        const under = underCard;
        if (!under) return;
        const reveal = Math.max(0, Math.min(1, progress));
        const scale = .965 + reveal * .035;
        const y = 12 - reveal * 12;
        under.style.transform = `translate3d(0, ${y}px, 0) scale(${scale})`;
        under.style.opacity = String(.78 + reveal * .22);
      }

      function renderActive() {
        underCard = null;
        visibleCards().forEach((card, index) => {
          card.classList.toggle('is-active', index === activeCardIndex);
          card.classList.remove('is-under');
          card.classList.remove('is-leaving');
          resetTransform(card);
        });
        showUnderCard(1, 0);
        updateSwipeState();
        const current = activeCard();
        if (current?.dataset.offerId) analytics.track('card_view', current.dataset.offerId);
      }

      function moveActiveCard(deltaX) {
        const card = activeCard();
        const limitedX = Math.max(-deckWidth, Math.min(deckWidth, deltaX));
        const progress = limitedX / Math.max(1, deckWidth);
        const arc = -Math.pow(Math.abs(progress), 1.35) * 42;
        showUnderCard(limitedX > 0 ? -1 : 1, Math.abs(progress));
        card.style.transform = `translate3d(${limitedX}px, ${arc}px, 0) rotate(${progress * 12}deg)`;
      }

      function queueActiveCardMove() {
        if (swipeFrame) return;
        swipeFrame = window.requestAnimationFrame(() => {
          swipeFrame = 0;
          moveActiveCard(pointerDeltaX);
        });
      }

      function animateCard(card, toTransform, complete) {
        const fromTransform = card.style.transform || 'translate3d(0, 0, 0) rotate(0deg)';
        const duration = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 360;
        card.style.transform = toTransform;
        const animation = card.animate([
          { transform: fromTransform },
          { transform: toTransform }
        ], {
          duration,
          easing: 'cubic-bezier(.4, 0, .6, 1)',
          fill: 'both'
        });
        cardAnimation = animation;
        let finished = false;
        const finish = () => {
          if (finished) return;
          finished = true;
          if (cardAnimation === animation) cardAnimation = null;
          animation.cancel();
          complete();
        };
        animation.addEventListener('finish', finish, { once: true });
        window.setTimeout(finish, duration + 100);
      }

      function finishSwipe(direction) {
        if (isAnimating) return;
        const cards = visibleCards();
        const nextIndex = direction && cards.length > 1
          ? (activeCardIndex + direction + cards.length) % cards.length
          : activeCardIndex;
        const card = activeCard();
        if (!direction || nextIndex === activeCardIndex) {
          isAnimating = true;
          showUnderCard(1, 0);
          animateCard(card, 'translate3d(0, 0, 0) rotate(0deg)', () => {
            isAnimating = false;
            resetTransform(card);
          });
          return;
        }
        isAnimating = true;
        card.classList.add('is-leaving');
        const exitDistance = Math.max(window.innerWidth, deckWidth) * 1.12;
        const exitX = direction > 0 ? -exitDistance : exitDistance;
        const completeTurn = () => {
          isAnimating = false;
          activeCardIndex = nextIndex;
          renderActive();
        };
        showUnderCard(direction, 1);
        animateCard(card, `translate3d(${exitX}px, -96px, 0) rotate(${direction > 0 ? -18 : 18}deg)`, completeTurn);
      }

      list.addEventListener('pointerdown', (event) => {
        if (isAnimating || event.target.closest('a, button, input, select, label')) return;
        activePointerId = event.pointerId;
        pointerStartX = event.clientX;
        pointerDeltaX = 0;
        didDrag = false;
        deckWidth = list.clientWidth;
        list.setPointerCapture(event.pointerId);
        list.classList.add('is-swiping');
      });
      list.addEventListener('pointermove', (event) => {
        if (event.pointerId !== activePointerId) return;
        pointerDeltaX = event.clientX - pointerStartX;
        if (Math.abs(pointerDeltaX) > 6) didDrag = true;
        queueActiveCardMove();
        event.preventDefault();
      });
      function releasePointer(event) {
        if (event.pointerId !== activePointerId) return;
        if (swipeFrame) {
          window.cancelAnimationFrame(swipeFrame);
          swipeFrame = 0;
        }
        moveActiveCard(pointerDeltaX);
        activeCard().getBoundingClientRect();
        list.classList.remove('is-swiping');
        activePointerId = null;
        const threshold = Math.min(92, deckWidth * .22);
        const direction = Math.abs(pointerDeltaX) >= threshold ? (pointerDeltaX < 0 ? 1 : -1) : 0;
        finishSwipe(direction);
      }
      list.addEventListener('pointerup', releasePointer);
      list.addEventListener('pointercancel', releasePointer);

      function goToCard(offset) {
        finishSwipe(offset);
      }
      swipePrev.addEventListener('click', () => goToCard(1));
      swipeNext.addEventListener('click', () => goToCard(-1));
      window.addEventListener('resize', () => {
        deckWidth = list.clientWidth;
        resetTransform(activeCard());
      });

      offers.forEach((offer) => {
        const openDetails = () => {
          analytics.track('detail_open', offer.dataset.offerId);
          window.location.href = offer.dataset.details;
        };
        offer.addEventListener('click', (event) => {
          if (didDrag) { didDrag = false; return; }
          const detailLink = event.target.closest('a[data-od-id^="details-"]');
          if (detailLink) {
            analytics.track('detail_open', offer.dataset.offerId);
            return;
          }
          if (event.target.closest('a, button, input, select, label')) return;
          openDetails();
        });
        offer.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') openDetails();
        });
      });

      function comparisonData(offer) {
        const metrics = [...offer.querySelectorAll('.key-metric')].map((node) => [node.querySelector('.metric-label').textContent, node.querySelector('.metric-value').textContent]);
        const facts = [...offer.querySelectorAll('.fact')].map((node) => [node.querySelector('.fact-label').textContent, node.querySelector('.fact-value').textContent]);
        const provider = offer.querySelector('.provider').textContent;
        const issuer = offer.querySelector('.issuer').textContent.replace('Банк-эмитент:', '').trim();
        return {
          name: offer.dataset.compareName,
          status: offer.dataset.status,
          conflict: offer.dataset.conflict === 'true',
          values: [['Провайдер', provider], ['Банк-эмитент', issuer], ...metrics, ...facts]
        };
      }

      function renderComparison() {
        const cards = [...selected].map((id) => document.getElementById(id)).filter(Boolean).map(comparisonData);
        if (!cards.length) {
          compareContent.innerHTML = '<p class="compare-empty">Выберите до трёх карт в каталоге.</p>';
          return;
        }
        compareContent.innerHTML = `<div class="compare-columns">${cards.map((card) => `<article class="compare-card"><h3>${card.name}</h3><div class="status-line"><span class="status status-${card.status}">${card.status}</span>${card.conflict ? '<span class="status status-conflict">conflict</span>' : ''}</div><ul class="compare-list">${card.values.map(([label, value]) => `<li><span>${label}</span><strong>${value}</strong></li>`).join('')}</ul></article>`).join('')}</div>`;
      }

      function syncComparison() {
        const count = selected.size;
        try { localStorage.setItem('card-comparison', JSON.stringify([...selected])); } catch (error) { /* Сравнение остаётся доступно в текущей вкладке. */ }
        document.querySelectorAll('.compare-count').forEach((node) => { node.textContent = count; });
        document.querySelectorAll('.compare-open').forEach((button) => { button.disabled = count === 0; });
        document.querySelectorAll('.compare-toggle').forEach((button) => {
          const isSelected = selected.has(button.dataset.cardId);
          button.classList.toggle('is-selected', isSelected);
          button.setAttribute('aria-pressed', String(isSelected));
          button.textContent = isSelected ? 'В сравнении' : 'Сравнить';
        });
        renderComparison();
      }

      document.querySelectorAll('.compare-toggle').forEach((button) => button.addEventListener('click', () => {
        const id = button.dataset.cardId;
        if (selected.has(id)) selected.delete(id);
        else if (selected.size < 3) selected.add(id);
        else {
          compareDialog.showModal();
          return;
        }
        syncComparison();
      }));
      document.querySelectorAll('.compare-open').forEach((button) => button.addEventListener('click', () => {
        renderComparison();
        compareDialog.showModal();
      }));
      document.querySelectorAll('.dialog-close').forEach((button) => button.addEventListener('click', () => compareDialog.close()));
      document.querySelector('#compare-clear').addEventListener('click', () => { selected.clear(); syncComparison(); });
      compareDialog.addEventListener('click', (event) => { if (event.target === compareDialog) compareDialog.close(); });

      syncComparison();
      renderActive();
    })();
  </script>
</body>
</html>
